# Christian Audience Intelligence — Search Terms
#
# Each term maps to a category and one or more sources.
# seasonal: true  = exclude from "emerging" detection (spikes every year by calendar)
# anchor: true    = used as normalization baseline in Google Trends batches (do not remove)
#
# Sources: google_trends | youtube | both

